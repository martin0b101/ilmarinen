
services:
  postgres:
    image: postgres:18
    container_name: ilmarinen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ilmarinen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ilmarinen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
